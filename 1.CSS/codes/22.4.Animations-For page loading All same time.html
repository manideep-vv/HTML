<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      #maincontent {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
        /* background-color: rgb(55, 173, 241); */
        background-color: #eee;
      }

      #i1 {
        width: 150px;
        display: flex;
        flex-wrap: wrap;
        background-color: rgb(167, 224, 113);
      }
      #i1 > div {
        width: 20px;
        height: 20px;
        border: 2px dashed;
        border-radius: 50%;
        background-color: black;
        animation: dott 1s linear 30;
        /* This means we are giving same
         animation to all div's */
        margin: 10px;
      }
      @keyframes dott {
        0% {
          transform: scale(0.5);
        }
        50% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="maincontent">
      <div id="i1">
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
        <div class="d1"></div>
      </div>
    </div>
  </body>
</html>
