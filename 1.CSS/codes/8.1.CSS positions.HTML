<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS position demo using animations</title>
    <style>
      body {
        border: 2px dashed;
        height: 80vh;
      }
      #p2 {
        border: 2px dashed pink;
        position: relative;
      }
      #c1 {
        background-color: rgb(108, 160, 240);
        top: 10px;
        position: absolute;
      }
    </style>
  </head>

  <body>
    <br />
    <div id="p2">
      i am parent 2
      <div id="c1">i am a child of p2</div>
    </div>
  </body>
</html>
