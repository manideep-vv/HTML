<!DOCTYPE html>

  <head>

    <title>Document</title>
    <style>
      #maincontent {

      }
      #p1 {
        display: grid;
        grid-template-columns: 100px 100px 100px;

        font-size: 50px;

        border: 2px dashed;
      }
      @keyframes dott {
        0% {
          font-size: 40px;
        }
        50% {
          /* font-size: 100px; */
        }
        100% {
          font-size: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div id="maincontent">
      <div id="p1">
        <div id="a1" clas="d1">m</div>

        <div class="d1">.</div>
