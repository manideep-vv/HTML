<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #maincontent {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
        background-color: rgb(241, 238, 55);
      }
      #p1 {
        display: grid;
        grid-template-columns: 100px 100px 100px 100px 100px;
        flex-wrap: wrap;
        width: 100px;
        justify-content: center;
        align-items: center;

        /* background-color: rgb(167, 224, 113); */
      }
      #a1 {
        font-size: 80px;
        animation: dott 1s linear infinite 0.5s normal;
      }
      #a2 {
        font-size: 80px;
        animation: dott 1s linear infinite 0.7s normal;
      }
      #a3 {
        font-size: 80px;
        animation: dott 1s linear infinite 0.8s normal;
      }
      #a4 {
        font-size: 80px;
        animation: dott 1s linear infinite 0.9s normal;
      }
      #a5 {
        font-size: 80px;
        animation: dott 1s linear infinite 1s normal;
      }
      @keyframes dott {
        0% {
          transform: rotate(-30deg);
        }
        50% {
          transform: skew(30deg);
          transform: scale(2);
        }
        100% {
          transform: scale(0.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="maincontent">
      <div id="p1">
        <div id="a1" class="d1">M</div>
        <div id="a2" class="d1">a</div>
        <div id="a3" class="d1">N</div>
        <div id="a4" class="d1">I</div>
      </div>
    </div>
  </body>
</html>
