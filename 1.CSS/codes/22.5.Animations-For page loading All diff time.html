<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      #maincontent {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
        /* background-color: rgb(55, 173, 241); */
        background-color: #eee;
      }

      #i1 {
        width: 150px;
        display: flex;
        flex-wrap: wrap;
        background-color: rgb(184, 235, 65);
      }
      #i1 > div {
        width: 20px;
        height: 20px;
        border: 2px dashed;
        border-radius: 50%;
        background-color: black;
        margin: 10px;
        animation: dott 2s 0.5 10 alternate;
      }
      #a1 {
        animation: dott 1s linear 0.1s 50;
      }
      #a2 {
        animation: dott 1s linear 0.2s 50;
      }
      #a3 {
        animation: dott 1s linear 0.3s 50;
      }
      #a4 {
        animation: dott 1s linear 0.4s 50;
      }
      #a5 {
        animation: dott 1s linear 0.5s 50;
      }
      #a6 {
        animation: dott 1s linear 0.6s 50;
      }
      #a7 {
        animation: dott 1s linear 0.7s 50;
      }
      #a8 {
        animation: dott 1s linear 0.8s 50;
      }
      #a9 {
        animation: dott 1s linear 0.9s 50;
      }
      @keyframes dott {
        0% {
          transform: scale(0.5);
        }
        50% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="maincontent">
      <div id="i1">
        <div id="a1" class="d1"></div>
        <div id="a2" class="d1"></div>
        <div id="a3" class="d1"></div>
        <div id="a4" class="d1"></div>
        <div id="a5" class="d1"></div>
        <div id="a6" class="d1"></div>
        <div id="a7" class="d1"></div>
        <div id="a8" class="d1"></div>
        <div id="a9" class="d1"></div>
      </div>
    </div>
  </body>
</html>
