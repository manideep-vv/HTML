<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>window- localstorage vs session storage</title>
  </head>
  <body>
    <h1>window- localstorage vs session storage</h1>
    <script>
      let emp = {
        name: "mani",
        sal: 40000,
      };
      //For localstorage These details will be stored in browser for ever with this website name
      //we should always store object details in string form
      window.localStorage.setItem(emp.name, JSON.stringify(emp));
      console.log("window script file executed");

      window.sessionStorage.setItem("phone", 10000);
      //   console.log("data has been set to session storage");
    </script>
  </body>
</html>
